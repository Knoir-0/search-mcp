[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "search-mcp"
version = "0.2.0"
description = "Containerized MCP server for searching Google, Stack Overflow, GitHub, and Reddit with ripgrep-powered snippet extraction"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
search-mcp = "server:main"
